<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010812">
  <title>JARVIS — Connexion</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/hud.css">
  <link rel="stylesheet" href="/css/landing.css">
</head>
<body class="auth-page">
  <main class="auth">
    <a class="back caps" href="/">← Accueil</a>
    <div id="orb" class="reactor passive mini"></div>
    <div class="auth-card panel">
      <div class="logo caps">J.A.R.V.I.S</div>
      <p class="muted center" id="auth-sub">Identifiez-vous pour accéder à votre assistant.</p>
      <div class="tabs" id="tabs">
        <button type="button" class="tab on" data-mode="login">Connexion</button>
        <button type="button" class="tab" data-mode="register">Créer un compte</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <input id="auth-user" name="username" placeholder="Nom d'utilisateur" autocomplete="username" autocapitalize="none" required>
        <input id="auth-pass" name="password" type="password" placeholder="Mot de passe (8 caractères min.)" autocomplete="current-password" minlength="8" required>
        <input id="auth-invite" name="invite" placeholder="Code d'invitation" autocomplete="off" autocapitalize="characters" hidden>
        <button class="btn primary" id="auth-submit" type="submit">Connexion</button>
        <p class="error" id="auth-error" role="alert"></p>
      </form>
    </div>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
